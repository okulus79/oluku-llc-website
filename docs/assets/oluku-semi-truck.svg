<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">Oluku LLC branded semi truck</title>
  <desc id="desc">Oluku Logistics semi truck with navy cab, gold trim, gently flashing amber marker lights and company website on its white trailer.</desc>
  <defs><linearGradient id="road" x2="0" y2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#e8edf2"/></linearGradient><linearGradient id="cab" x2="0" y2="1"><stop stop-color="#173c68"/><stop offset="1" stop-color="#091d38"/></linearGradient></defs>
  <style>@keyframes amber-marker-flash{0%,100%{opacity:.45}50%{opacity:1}}.marker-light{animation:amber-marker-flash 1.1s ease-in-out infinite alternate}@media(prefers-reduced-motion:reduce){.marker-light{animation:none;opacity:1}}</style>
  <rect width="720" height="300" fill="url(#road)"/><ellipse cx="371" cy="247" rx="301" ry="18" fill="#10233d" opacity=".12"/>
  <rect x="54" y="77" width="421" height="125" rx="7" fill="#fff" stroke="#cbd5df" stroke-width="3"/>
