  <text x="226" y="142" fill="#9a7028" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="3">GLOBAL LOGISTICS</text>
  <text x="226" y="160" fill="#0b2344" font-family="Arial,sans-serif" font-size="13" font-weight="700">www.Olukullc.com</text>
